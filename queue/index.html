<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="robots" content="noindex, nofollow" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Upwork queue" />
  <meta name="theme-color" content="#0B0F17" />
  <link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%2322C55E'/%3E%3Cpath d='M98 40v55h40L82 140V85H42z' fill='%230B0F17'/%3E%3C/svg%3E" />
  <title>Upwork queue · Flowtive</title>
  <style>
    :root { --ink: #0B0F17; --ink2: #121826; --line: rgba(255,255,255,.1); --txt: #e2e8f0; --mut: #94a3b8; --acc: #22C55E; --acc2: #4ADE80; --warn: #f59e0b; --bad: #ef4444; }
    * { box-sizing: border-box; }
    body { margin: 0; background: var(--ink); color: var(--txt); font-family: Inter, -apple-system, system-ui, sans-serif; -webkit-font-smoothing: antialiased; padding: env(safe-area-inset-top) 0 env(safe-area-inset-bottom); }
    .wrap { max-width: 640px; margin: 0 auto; padding: 20px 18px 40px; }
    header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 18px; }
    .brand { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .bolt { width: 28px; height: 28px; border-radius: 8px; background: var(--acc); display: grid; place-items: center; }
    .bolt svg { width: 14px; height: 14px; }
    .pill { font-size: 12px; color: var(--mut); border: 1px solid var(--line); border-radius: 999px; padding: 4px 10px; }
    .pill.q { color: var(--warn); border-color: rgba(245,158,11,.4); }
    h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -.01em; }
    p.sub { color: var(--mut); margin: 0 0 18px; font-size: 14px; }
    label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: .12em; color: var(--mut); margin: 14px 0 6px; }
    input, textarea { width: 100%; background: var(--ink2); color: var(--txt); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; font: inherit; font-size: 16px; }
    input:focus, textarea:focus { outline: none; border-color: var(--acc); }
    textarea { min-height: 220px; resize: vertical; line-height: 1.45; }
    textarea.note { min-height: 70px; }
    button { width: 100%; margin-top: 18px; background: var(--acc); color: var(--ink); border: 0; border-radius: 12px; padding: 14px; font: inherit; font-size: 16px; font-weight: 600; }
    button:active { background: var(--acc2); }
    button[disabled] { opacity: .5; }
    .msg { margin-top: 14px; font-size: 14px; color: var(--mut); min-height: 20px; }
    .msg.ok { color: var(--acc2); } .msg.bad { color: var(--bad); }
    .queue { margin-top: 26px; border-top: 1px solid var(--line); padding-top: 14px; }
    .queue h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .12em; color: var(--mut); margin: 0 0 10px; }
    .item { background: var(--ink2); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; margin-bottom: 8px; display: flex; justify-content: space-between; gap: 10px; }
    .item span { color: var(--mut); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .item b { color: var(--warn); font-weight: 500; flex-shrink: 0; }
    .flush { background: transparent; color: var(--acc2); border: 1px solid rgba(34,197,94,.4); margin-top: 6px; }
    details { margin-top: 24px; font-size: 13px; color: var(--mut); }
    details input { margin-top: 8px; font-size: 14px; }
    summary { cursor: pointer; }
  </style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand"><div class="bolt"><svg viewBox="0 0 24 24" fill="none" stroke="#0B0F17" stroke-width="2.5"><path stroke-linecap="round" stroke-linejoin="round" d="M13 10V3L4 14h7v7l9-11h-7z"/></svg></div>Flowtive</div>
    <div class="pill" id="net">online</div>
  </header>

  <h1>Upwork queue</h1>
  <p class="sub">Paste a job. It is picked up by the morning pipeline and the proposal is waiting when you get to your desk.</p>

  <form id="f" autocomplete="off">
    <label for="link">Upwork link</label>
    <input id="link" type="url" inputmode="url" placeholder="https://www.upwork.com/jobs/~0…" required />
    <label for="posting">Job posting (title, description, budget, screening questions)</label>
    <textarea id="posting" placeholder="Paste the whole posting here" required></textarea>
    <label for="note">Note to Claude (optional)</label>
    <textarea id="note" class="note" placeholder="e.g. bid at budget, lean on the WhatsApp build, keep it short"></textarea>
    <button id="send" type="submit">Add to queue</button>
    <div class="msg" id="msg"></div>
  </form>

  <div class="queue" id="queue" hidden>
    <h2>Waiting for signal</h2>
    <div id="items"></div>
    <button class="flush" id="flush" type="button">Send now</button>
  </div>

  <details>
    <summary>Settings</summary>
    <label for="secret">Shared secret (set once; stored on this phone)</label>
    <input id="secret" type="password" placeholder="matches the Make scenario filter" />
  </details>
</div>

<script>
  // The Make webhook that appends a row to the "Upwork queue" Google Sheet.
  const WEBHOOK_URL = "__MAKE_WEBHOOK_URL__";
  const KEY = "upwork-queue-v1", SKEY = "upwork-queue-secret";

  const $ = (id) => document.getElementById(id);
  const load = () => JSON.parse(localStorage.getItem(KEY) || "[]");
  const save = (q) => localStorage.setItem(KEY, JSON.stringify(q));

  $("secret").value = localStorage.getItem(SKEY) || "";
  $("secret").addEventListener("change", (e) => localStorage.setItem(SKEY, e.target.value.trim()));

  function render() {
    const q = load();
    $("queue").hidden = q.length === 0;
    $("items").innerHTML = q.map((j) => `<div class="item"><span>${j.link.replace(/^https?:\/\/(www\.)?/, "")}</span><b>queued</b></div>`).join("");
    $("net").textContent = navigator.onLine ? (q.length ? `${q.length} queued` : "online") : `offline · ${q.length} queued`;
    $("net").className = "pill" + (q.length ? " q" : "");
  }

  async function post(job) {
    const r = await fetch(WEBHOOK_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(job) });
    if (!r.ok) throw new Error("webhook " + r.status);
  }

  async function flush() {
    let q = load(); if (!q.length) return;
    $("flush").disabled = true;
    let sent = 0;
    for (const job of [...q]) {
      try { await post(job); q = q.filter((j) => j.id !== job.id); save(q); sent++; }
      catch (e) { break; }
    }
    $("flush").disabled = false; render();
    if (sent) say(`${sent} sent to the pipeline`, "ok");
  }

  function say(t, cls) { const m = $("msg"); m.textContent = t; m.className = "msg " + (cls || ""); }

  $("f").addEventListener("submit", async (e) => {
    e.preventDefault();
    const job = {
      id: Date.now() + "-" + Math.random().toString(36).slice(2, 8),
      submitted_at: new Date().toISOString(),
      link: $("link").value.trim(),
      posting: $("posting").value.trim(),
      note: $("note").value.trim(),
      secret: localStorage.getItem(SKEY) || "",
    };
    if (!job.secret) { say("Set the shared secret under Settings first.", "bad"); return; }
    $("send").disabled = true;
    try {
      await post(job); say("Sent. It will be ready at your desk.", "ok");
    } catch (err) {
      const q = load(); q.push(job); save(q);
      say(navigator.onLine ? "Couldn't reach the pipeline, kept in the queue. Tap Send now later." : "No signal. Kept in the queue; open this page when you have signal.", "");
    }
    $("send").disabled = false;
    $("f").reset(); render();
  });

  $("flush").addEventListener("click", flush);
  window.addEventListener("online", () => { render(); flush(); });
  window.addEventListener("offline", render);
  document.addEventListener("visibilitychange", () => { if (!document.hidden && navigator.onLine) flush(); });
  render(); if (navigator.onLine) flush();
</script>
</body>
</html>
